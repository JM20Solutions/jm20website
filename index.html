/* ─────────────────────────────────────────────────
   GLOBAL CSS — Apple Dark typography + components
───────────────────────────────────────────────── */
const css = `
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:#2a2a2c;font-family:Inter,SF Pro Display,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#ffffff;overflow-x:hidden}
#root{overflow-x:hidden;max-width:100vw}
::selection{background:rgba(41,151,255,0.3);color:#ffffff}
html{scrollbar-color:rgba(255,255,255,0.35) #1d1d1f}

/* Apple Dark keyframes */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-5px);opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@keyframes msgReveal{from{opacity:0;transform:translateY(10px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes heroGlow{0%,100%{transform:translateX(-50%) scale(1);opacity:0.55}50%{transform:translateX(-50%) scale(1.22);opacity:1}}
@keyframes heroGlow2{0%,100%{opacity:0.35;transform:scale(1)}50%{opacity:0.85;transform:scale(1.15)}}
@keyframes carouselProgress{from{width:0%}to{width:100%}}
@keyframes shotIn{0%{opacity:0;transform:translateY(14px) scale(.98)}8%,92%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(0) scale(1)}}
@keyframes shotScan{0%,10%{top:0;opacity:0}14%{opacity:1}58%{top:100%;opacity:1}62%,100%{top:100%;opacity:0}}
@keyframes ansIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes caretBlink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shotPop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes shotGlow{0%,100%{box-shadow:0 0 0 0 var(--shot-c)}50%{box-shadow:0 0 28px 2px var(--shot-c)}}
@keyframes teaserPan{0%,100%{transform:scale(1.04)}50%{transform:scale(1.13)}}
@keyframes teaserShift{0%,100%{background-position:20% 30%}50%{background-position:80% 70%}}

/* Apple pill CTA — btn-primary: #2997ff on dark */
.btn-primary{
  background:#2997ff;
  color:#ffffff;
  padding:11px 22px;
  border-radius:9999px;           /* rounded.pill */
  font-size:17px;
  font-weight:400;
  letter-spacing:-0.374px;        /* SF Pro Text body tracking */
  cursor:pointer;
  border:none;
  transition:opacity .18s, transform .18s;
  font-family:Inter,SF Pro Text,system-ui,-apple-system,sans-serif;
  display:inline-block;
  text-align:center;
}
.btn-primary:hover{opacity:.88}
.btn-primary:active{transform:scale(0.95)}  /* Apple system micro-interaction */

/* Ghost pill — outline variant */
.btn-ghost{
  background:transparent;
  color:#2997ff;
  border:1px solid #2997ff;
  padding:11px 22px;
  border-radius:9999px;
  font-size:17px;
  font-weight:400;
  letter-spacing:-0.374px;
  cursor:pointer;
  transition:opacity .18s, transform .18s;
  font-family:Inter,SF Pro Text,system-ui,-apple-system,sans-serif;
  display:inline-block;
  text-align:center;
}
.btn-ghost:hover{opacity:.8}
.btn-ghost:active{transform:scale(0.95)}

/* Apple utility card */
.card{
  background:#1d1d1f;
  border:1px solid rgba(255,255,255,0.09);
  border-radius:18px;              /* rounded.lg */
  transition:box-shadow .2s,transform .2s;
}
.card:hover{box-shadow:0 8px 32px rgba(0,0,0,0.6);transform:translateY(-2px)}

a{text-decoration:none}
input,button,select,textarea{font-family:Inter,SF Pro Text,system-ui,-apple-system,sans-serif}

.nav-links-center{display:flex;gap:0.125rem;align-items:center;position:absolute;left:50%;transform:translateX(-50%)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px}
.nav-hamburger span{display:block;width:22px;height:2px;background:rgba(255,255,255,0.8);border-radius:2px;transition:all .2s}

  .pricing-grid{
    display:flex !important;
    flex-direction:column !important;
    gap:1.25rem !important;
  }

  /* Footer — 4 cols → 2 cols */
  .footer-grid{
    grid-template-columns:1fr 1fr !important;
    gap:2rem !important;
  }

  /* 2-col sections → 1 col */
  .two-col{
    grid-template-columns:1fr !important;
    gap:2.5rem !important;
    direction:ltr !important;
  }

  /* Security steps and value props — 3 col → 1 col */
  .steps-grid{
    grid-template-columns:1fr !important;
  }

  /* About page grid */
  .about-grid{
    grid-template-columns:1fr !important;
    gap:2rem !important;
  }

  /* Channel selector 2-col on mobile */
  .channel-grid{
    grid-template-columns:1fr 1fr !important;
  }

  /* Demo and mowaat flex → column */
  .demo-flex, .mowaat-flex{
    flex-direction:column !important;
  }

  /* Demo outer container — column on mobile */
  .demo-outer{
    flex-direction:column !important;
    align-items:stretch !important;
    gap:1.5rem !important;
  }

  /* Demo right panel — full width on mobile */
  .demo-right-panel{
    min-width:0 !important;
    max-width:100% !important;
    width:100% !important;
  }

  /* Headings — prevent overflow */
  h1{ font-size:clamp(1.5rem,7vw,2rem) !important; word-break:break-word !important; }
  h2{ font-size:clamp(1.3rem,6vw,1.75rem) !important; word-break:break-word !important; }

  /* Text — prevent overflow */
  p, span, li, div{
    word-break:break-word !important;
    overflow-wrap:break-word !important;
  }

  /* Hero stats — fit 3 cols in viewport */
  .hero-stats-grid{
    max-width:100vw !important;
    overflow:hidden !important;
  }
  .hero-stats-grid > div{
    padding:0.75rem 0.5rem !important;
  }
  .hero-stats-grid span:first-child{
    font-size:1.1rem !important;
  }
  .hero-stats-grid span:last-child{
    font-size:10px !important;
  }

  /* Process step badges — don't overflow */
  .process-step{
    flex-wrap:wrap !important;
    gap:0.5rem !important;
  }
  .process-step .badge{
    flex-shrink:0 !important;
  }

  /* Products page — hide visuals on mobile, show copy only */
  .product-visual-col{
    display:none !important;
    visibility:hidden !important;
    width:0 !important;
    height:0 !important;
    overflow:hidden !important;
  }

  /* Products page — full width copy col on mobile */
  .product-copy-col{
    width:100% !important;
    grid-column:1 / -1 !important;
  }

  /* Contact page — 2 col → 1 col */
  .contact-grid{
    grid-template-columns:1fr !important;
    min-height:auto !important;
    display:block !important;
  }
  .contact-grid > div{
    padding:1.75rem 1.25rem !important;
    width:100% !important;
    box-sizing:border-box !important;
  }
  /* Hide the left info panel on mobile — form only */
  .contact-info-panel{
    display:none !important;
  }

  /* All sections — reduce side padding on mobile */
  section{
    padding-left:1rem !important;
    padding-right:1rem !important;
    box-sizing:border-box !important;
    width:100% !important;
    overflow-x:hidden !important;
  }

  /* Trust bar — smaller gap and font on mobile */
  .trust-bar{
    gap:1rem !important;
    padding:0.55rem 1rem !important;
  }
  .trust-bar span{
    font-size:10px !important;
  }
  .trust-bar svg{
    width:12px !important;
    height:12px !important;
  }

  /* Live badge in chat header — fix alignment */
  .live-badge{
    flex-shrink:0 !important;
    white-space:nowrap !important;
  }

  /* Cero Migración — fix right overflow from section padding */
  .no-migration-section{
    padding-left:1rem !important;
    padding-right:1rem !important;
  }

  /* All maxWidth containers — respect viewport */
  .two-col, [style*="maxWidth:1100"], [style*="maxWidth:760"]{
    width:100% !important;
    box-sizing:border-box !important;
  }


  /* Pricing card — each card is its own rounded box when stacked */
  .pricing-grid > div{
    border-radius:18px !important;
  }
}
